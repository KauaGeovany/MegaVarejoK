name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/compras-pdv-estoque-avancado]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q app.py controllers database models repositories services
      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check static/js/app.js
      - run: node --check static/js/logistica.js
      - name: Run automated tests
        run: python -m unittest discover -v
